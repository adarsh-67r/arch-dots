name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners ship shellcheck.
      - run: shellcheck -x install.sh setup.sh lib/ui.sh scripts/* dev/* hardware/omen-8bcd/{hdmi-mode,nv-run,greeter-gpu}
        shell: bash

  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      # Every package nagi can install must exist in core/extra/multilib or the AUR.
      - run: |
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm
          dev/check-packages

