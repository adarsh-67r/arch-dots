name: shellcheck
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners ship shellcheck.
      - run: shellcheck -x install.sh setup.sh lib/ui.sh scripts/* hardware/omen-8bcd/{hdmi-mode,nv-run,greeter-gpu}
        shell: bash
